[project]
name = "habit-tracker-project"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "djangorestframework (>=3.18.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (==4.6.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "drf-yasg (>=1.21.15,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "coverage (>=7.16.2,<8.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]
lint = [
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.4.1,<8.0.0)"
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
